name: Refresh publications and deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * *' # Approximately 07:47 IST, daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public ORCID publications
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python scripts/fetch_publications.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify publication handling
        run: |
          npm test -- --watchAll=false --runInBand
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build
        run: npm run build
      - name: Save refreshed publication catalog
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/publications.json src/data/publications-cache.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public ORCID publications'
            git push origin HEAD:main
          fi
      - name: Publish GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          keep_files: false
