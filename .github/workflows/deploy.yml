name: Refresh publications and deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * *' # Daily, about 07:47 India time.
  workflow_dispatch:

permissions: {}

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and build offline
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          node scripts/test_model_engine.cjs
          python scripts/update_publications.py
          python scripts/build_site.py
          test -s _site/index.html
          test -s _site/data/publications.json

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    outputs:
      mode: ${{ steps.pages.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check publication and model regressions
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          node scripts/test_model_engine.cjs
      - name: Refresh publication sources
        id: refresh
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python scripts/update_publications.py --refresh
      - name: Assemble publication catalogue
        run: python scripts/update_publications.py
      - name: Capture the latest journal page when available
        id: preview
        timeout-minutes: 2
        continue-on-error: true
        run: |
          if [[ "$(python scripts/paper_preview.py --needed)" == "true" ]]; then
            python -m pip install --disable-pip-version-check 'playwright==1.55.0'
            python scripts/paper_preview.py
          fi
      - name: Build from the available catalogue
        run: |
          python scripts/build_site.py
          test -s _site/index.html
          test -s _site/data/publications.json
      - name: Save refreshed data
        if: (steps.refresh.outcome == 'success' || steps.preview.outcome == 'success') && github.ref == 'refs/heads/main'
        run: |
          git add data/remote-publications.json data/publications.json assets/paper-previews
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update public research catalogue'
            git push origin HEAD:main
          fi
      - name: Read existing Pages configuration
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          config=$(gh api "repos/$GITHUB_REPOSITORY/pages")
          mode=$(jq -r '.build_type' <<< "$config")
          case "$mode" in
            workflow) ;;
            legacy)
              branch=$(jq -r '.source.branch' <<< "$config")
              path=$(jq -r '.source.path' <<< "$config")
              if [[ "$branch" != gh-pages || "$path" != / ]]; then
                echo "::error::Select GitHub Actions or the gh-pages root in Settings > Pages."
                exit 1
              fi
              ;;
            *) echo "::error::Unsupported GitHub Pages mode: $mode"; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Publish to the configured Pages branch
        if: steps.pages.outputs.mode == 'legacy'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
      - name: Request a Pages rebuild after a bot push
        if: steps.pages.outputs.mode == 'legacy'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_PUBLISH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN != '' }}
        run: |
          if [[ "$HAS_PUBLISH_TOKEN" == 'false' ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
      - name: Upload static Pages artifact
        if: steps.pages.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Report refresh failure
        if: steps.refresh.outcome == 'failure'
        run: echo '::warning::Both publication services failed. This build uses the last saved catalogue.'

  deploy:
    if: needs.build.outputs.mode == 'workflow'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static site
        id: deployment
        uses: actions/deploy-pages@v4
